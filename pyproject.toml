[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptdiff"
version = "0.1.0"
description = "Compare LLM outputs when a prompt changes; fail on behavioral regressions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
promptdiff = "promptdiff.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/promptdiff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"